services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-retrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retrace}
      POSTGRES_DB: ${POSTGRES_DB:-retrace}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-retrace} -d ${POSTGRES_DB:-retrace}"]
      interval: 5s
      timeout: 5s
      retries: 10

  chroma:
    image: chromadb/chroma:0.5.23
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-retrace}:${POSTGRES_PASSWORD:-retrace}@postgres:5432/${POSTGRES_DB:-retrace}
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
    volumes:
      - ./data/corpus:/data/corpus:ro
      - ./data/reports:/data/reports
      - ./scripts:/scripts:ro
      - ./docs/runbooks:/app/runbooks:ro
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
        # Bake the same API_KEY the backend loads from .env so the UI default matches.
        # Rebuild the frontend after changing API_KEY.
        VITE_API_KEY: ${API_KEY}
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  chroma_data:
