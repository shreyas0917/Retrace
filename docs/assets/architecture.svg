<svg xmlns="http://www.w3.org/2000/svg" width="1344" height="1296" viewBox="0 0 1344 1296" role="img" aria-labelledby="t d">
<title id="t">Retrace system architecture</title>
<desc id="d">Console and CLI drive a FastAPI backend and in-process services; a six-stage diagnostic pipeline (ingest, retrieve, generate, judge, diagnose, investigate) persists to PostgreSQL and ChromaDB, is exercised by evaluation suites, experiments and a baseline regression gate, and feeds operations endpoints and runbooks.</desc>
