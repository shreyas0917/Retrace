<svg xmlns="http://www.w3.org/2000/svg" width="1344" height="1296" viewBox="0 0 1344 1296" role="img" aria-labelledby="t d">
<title id="t">Retrace system architecture</title>
<desc id="d">Console (session cookie) and CLI drive a FastAPI backend with session auth, rate limiting and request hardening; a six-stage diagnostic pipeline (ingest, retrieve with injection flags, generate, judge, diagnose with calibrated confidence and an uncertain outcome, investigate) persists to PostgreSQL (traces plus durable telemetry) and ChromaDB, is measured by planted, held-out and calibration suites, experiments, baselines and a regression gate, and feeds operations endpoints with p50/p95/p99 latency, cost and runbooks.</desc>
