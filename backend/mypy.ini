# Type gate used by CI (.github/workflows/ci.yml). Run from backend/:
#   mypy
# Strict checks cover the diagnosis engine and the evaluation code; other
# modules are followed for their types but not held to the same rules yet.
[mypy]
python_version = 3.11
plugins = pydantic.mypy
files = app/services/diagnosis, app/services/eval
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
# Modules outside `files` are type-checked for their signatures only; their own
# errors are not reported here.
follow_imports = silent

[mypy-app.services.diagnosis.*,app.services.eval.*]
disallow_untyped_defs = true
check_untyped_defs = true

# Third-party packages without type information.
[mypy-chromadb.*,sentence_transformers.*,torch.*,transformers.*,numpy.*,psycopg.*]
ignore_missing_imports = true
