# Lint and format gate used by CI (.github/workflows/ci.yml).
target-version = "py311"
line-length = 120
# Migrations are frozen once released: never reformat or autofix them.
extend-exclude = ["**/alembic/versions/**"]

[lint]
# E9 syntax errors, F pyflakes, I import order, B bugbear, UP pyupgrade.
select = ["E9", "F", "I", "B", "UP"]

[lint.flake8-bugbear]
# FastAPI resolves Depends() per request; it is not a shared mutable default.
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]

[lint.isort]
known-first-party = ["app"]
